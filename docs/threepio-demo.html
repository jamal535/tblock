<title>Threepio Walkthrough</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: the tblock 101 "Imperial Ops" shell. A heavy sidebar (l0) holds the flows and the step list;
   the reading pane (l2) holds the cast strip, then the step's story beside the screen it produces.
   Midnight is home; light swaps values, never components. Amber marks threepio, green marks you. */
:root {
  --l0:#050505; --l1:#0b0b0b; --l2:#101010; --l3:#161616; --l4:#1c1c1c; --l5:#242424;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.11); --line-3:rgba(255,255,255,.18);
  --fg:#ededed; --fg-2:#a3a3a3; --fg-3:#737373; --row-name:#d6d6d6;
  --green:#45c47a; --amber:#e0a93e; --red:#f0565c;
  --green-wash:color-mix(in srgb, var(--green) 10%, transparent); --green-edge:color-mix(in srgb, var(--green) 24%, transparent);
  --amber-wash:color-mix(in srgb, var(--amber) 10%, transparent); --amber-edge:color-mix(in srgb, var(--amber) 28%, transparent);
  --red-wash:color-mix(in srgb, var(--red) 9%, transparent); --red-edge:color-mix(in srgb, var(--red) 24%, transparent);
  --primary:#fafafa; --primary-fg:#0a0a0a; --primary-hover:#e2e2e2;
  --tint:rgba(255,255,255,.06); --tint-2:rgba(255,255,255,.07);
  --well:rgba(0,0,0,.35); --well-2:rgba(0,0,0,.3); --card-edge:rgba(255,255,255,.03);
  --focus-ring:rgba(255,255,255,.45); --selection:rgba(255,255,255,.22);
  --shadow-pop:0 16px 40px rgba(0,0,0,.5);
  --sans:'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --l0:#efefef; --l1:#f7f7f7; --l2:#ffffff; --l3:#fafafa; --l4:#ececec; --l5:#e2e2e2;
    --line:rgba(0,0,0,.07); --line-2:rgba(0,0,0,.1); --line-3:rgba(0,0,0,.2);
    --fg:#171717; --fg-2:#525252; --fg-3:#737373; --row-name:#262626;
    --green:#1f9d55; --amber:#a66a00; --red:#d42a31;
    --primary:#171717; --primary-fg:#ffffff; --primary-hover:#333333;
    --tint:rgba(0,0,0,.04); --tint-2:rgba(0,0,0,.05);
    --well:rgba(255,255,255,.9); --well-2:rgba(0,0,0,.025); --card-edge:rgba(255,255,255,.8);
    --focus-ring:rgba(0,0,0,.4); --selection:rgba(0,0,0,.12);
    --shadow-pop:0 12px 32px rgba(0,0,0,.12);
    color-scheme:light;
  }
}
:root[data-theme="light"] {
  --l0:#efefef; --l1:#f7f7f7; --l2:#ffffff; --l3:#fafafa; --l4:#ececec; --l5:#e2e2e2;
  --line:rgba(0,0,0,.07); --line-2:rgba(0,0,0,.1); --line-3:rgba(0,0,0,.2);
  --fg:#171717; --fg-2:#525252; --fg-3:#737373; --row-name:#262626;
  --green:#1f9d55; --amber:#a66a00; --red:#d42a31;
  --primary:#171717; --primary-fg:#ffffff; --primary-hover:#333333;
  --tint:rgba(0,0,0,.04); --tint-2:rgba(0,0,0,.05);
  --well:rgba(255,255,255,.9); --well-2:rgba(0,0,0,.025); --card-edge:rgba(255,255,255,.8);
  --focus-ring:rgba(0,0,0,.4); --selection:rgba(0,0,0,.12);
  --shadow-pop:0 12px 32px rgba(0,0,0,.12);
  color-scheme:light;
}
:root[data-theme="dark"] { color-scheme:dark; }

* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { background:var(--l2); }
body { margin:0; color:var(--fg); font:400 14px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
::selection { background:var(--selection); }
button { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; }
code, .mono { font-family:var(--mono); font-size:.93em; }

/* ---------- shell ---------- */
.shell { display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh; }
.side { background:var(--l0); border-right:1px solid var(--line); position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:14px; padding:18px 12px 14px max(12px, env(safe-area-inset-left, 0px)); }
.brand { display:flex; align-items:center; gap:10px; padding:2px 8px 6px; }
.brand-mark { width:26px; height:26px; border-radius:6px; background:var(--primary); color:var(--primary-fg); display:grid; place-items:center; font:600 13px/1 var(--mono); letter-spacing:-.04em; }
.brand-name { font-weight:600; letter-spacing:-.01em; }
.brand-ver { margin-left:auto; font:400 11px var(--mono); color:var(--fg-3); }
.nav-label { font-size:12px; color:var(--fg-3); padding:0 10px; margin-bottom:-8px; }
.nav { display:flex; flex-direction:column; gap:2px; }
.nav-item { height:34px; display:flex; align-items:center; gap:10px; padding:0 8px 0 10px; border-radius:7px; border:0; background:transparent; color:var(--fg-2); font-size:13px; font-weight:500; cursor:pointer; text-align:left; transition:background-color 120ms var(--ease-out), color 120ms var(--ease-out); }
.nav-item svg { width:16px; height:16px; flex:none; opacity:.8; }
.nav-item .kbd { margin-left:auto; }
.nav-item .stat { width:6px; height:6px; border-radius:999px; flex:none; }
.nav-item .stat.green { background:var(--green); } .nav-item .stat.amber { background:var(--amber); }
.nav-item[aria-current="page"] { background:var(--l4); color:var(--fg); box-shadow:inset 0 0 0 1px var(--line); }
@media (hover:hover) and (pointer:fine) { .nav-item:hover { background:var(--l3); color:var(--fg); } }

.steps { position:relative; flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:1px; padding:2px; scrollbar-width:thin; }
.step-btn { display:grid; grid-template-columns:22px minmax(0,1fr); gap:10px; align-items:center; text-align:left; padding:6px 10px; border-radius:8px; border:0; background:transparent; color:var(--fg-3); cursor:pointer; font-size:13px; font-weight:500; transition:background-color 120ms var(--ease-out), color 120ms var(--ease-out); }
.step-btn .n { width:22px; height:22px; border-radius:999px; display:grid; place-items:center; font:500 11px var(--mono); color:var(--fg-3); box-shadow:inset 0 0 0 1px var(--line-2); font-variant-numeric:tabular-nums; }
.step-btn.done { color:var(--fg-2); }
.step-btn.done .n { color:var(--fg); box-shadow:inset 0 0 0 1px var(--line-3); }
.step-btn[aria-current="step"] { background:var(--l4); color:var(--fg); box-shadow:inset 0 0 0 1px var(--line); }
.step-btn[aria-current="step"] .n { background:var(--primary); color:var(--primary-fg); box-shadow:none; }
@media (hover:hover) and (pointer:fine) { .step-btn:hover { background:var(--l3); color:var(--fg); } }

.side-foot { display:flex; flex-direction:column; gap:2px; }
.kbd { display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 5px; border-radius:4px; background:var(--tint); box-shadow:inset 0 0 0 1px var(--line); font:500 11px/1 var(--sans); color:var(--fg-2); }

.btn { height:34px; display:inline-flex; align-items:center; gap:8px; padding:0 14px; border-radius:9px; border:0; font-size:13px; font-weight:500; cursor:pointer; transition:background-color 150ms var(--ease-out), transform 160ms var(--ease-out), opacity 150ms; white-space:nowrap; }
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.4; cursor:default; transform:none; }
.btn-primary { background:var(--primary); color:var(--primary-fg); }
.btn-primary .kbd { background:rgba(127,127,127,.18); box-shadow:none; color:inherit; }
.btn-secondary { background:var(--l4); color:var(--fg); box-shadow:inset 0 0 0 1px var(--line-2); }
.btn-ghost { background:transparent; color:var(--fg-2); }
@media (hover:hover) and (pointer:fine) {
  .btn-primary:not(:disabled):hover { background:var(--primary-hover); }
  .btn-secondary:not(:disabled):hover { background:var(--l5); }
  .btn-ghost:hover { background:var(--l3); color:var(--fg); }
}
.btn svg { width:15px; height:15px; }
.side-btn { width:100%; justify-content:flex-start; height:32px; padding:0 10px; }
.side-btn .kbd { margin-left:auto; }
.side-btn[aria-pressed="true"] { background:var(--l3); color:var(--fg); }

/* ---------- pane ---------- */
.main { min-width:0; }
.pane { max-width:1120px; margin:0 auto; padding:28px max(40px, env(safe-area-inset-right, 0px)) 64px 40px; display:flex; flex-direction:column; gap:22px; }
.head { display:flex; flex-direction:column; gap:10px; }
.eyebrow { font-size:12px; color:var(--fg-3); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.eyebrow .sep { opacity:.6; }
h1 { font-size:26px; font-weight:600; line-height:1.2; letter-spacing:-.025em; margin:0; text-wrap:balance; max-width:760px; }
h2 { font-size:20px; font-weight:600; line-height:1.25; letter-spacing:-.02em; margin:0; text-wrap:balance; }
.lead { font-size:17px; line-height:1.62; letter-spacing:-.005em; color:var(--fg-2); margin:0; max-width:68ch; }
p { margin:0; color:var(--fg-2); line-height:1.6; max-width:68ch; }
p strong { color:var(--fg); font-weight:500; }
.meta { font-size:12px; color:var(--fg-3); }
.toolbar { display:flex; gap:10px 16px; align-items:center; flex-wrap:wrap; }
.toolbar .meta { margin-left:auto; }
.ctl { display:flex; align-items:center; gap:8px; }
.ctl-label { font-size:12px; color:var(--fg-3); }

.seg { display:inline-flex; gap:2px; padding:2px; border-radius:9px; background:var(--well-2); box-shadow:inset 0 0 0 1px var(--line); max-width:100%; overflow-x:auto; }
.seg button { height:28px; padding:0 10px; border-radius:7px; border:0; background:transparent; color:var(--fg-3); font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; transition:background-color 150ms var(--ease-out), color 150ms var(--ease-out); }
.seg button[aria-pressed="true"] { background:var(--l4); color:var(--fg); box-shadow:inset 0 0 0 1px var(--line); }
@media (hover:hover) and (pointer:fine) { .seg button:hover { color:var(--fg); } }

.chip { display:inline-flex; align-items:center; height:20px; padding:0 8px; border-radius:999px; font-size:11px; font-weight:500; color:var(--fg-2); background:var(--tint); box-shadow:inset 0 0 0 1px var(--line); white-space:nowrap; }
.chip.mono { font-family:var(--mono); font-weight:400; }
.chip.fu { color:var(--amber); background:var(--amber-wash); box-shadow:inset 0 0 0 1px var(--amber-edge); }
.pill { display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 9px; border-radius:999px; font-size:12px; font-weight:500; white-space:nowrap; color:var(--fg-2); background:var(--tint); box-shadow:inset 0 0 0 1px var(--line); width:fit-content; }
.pill::before { content:""; width:6px; height:6px; border-radius:999px; background:currentColor; }
.pill.green, .pill.you { color:var(--green); background:var(--green-wash); box-shadow:inset 0 0 0 1px var(--green-edge); }
.pill.amber, .pill.threepio { color:var(--amber); background:var(--amber-wash); box-shadow:inset 0 0 0 1px var(--amber-edge); }
.pill.red { color:var(--red); background:var(--red-wash); box-shadow:inset 0 0 0 1px var(--red-edge); }

.card { background:var(--l3); border-radius:12px; padding:14px 16px; box-shadow:inset 0 1px 0 var(--card-edge), inset 0 0 0 1px var(--line); }

/* ---------- cast strip ---------- */
.cast { position:relative; padding:16px 8px 14px; }
.actors { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; position:relative; z-index:1; }
.actor { display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; opacity:.45; transition:opacity .3s var(--ease-out); min-width:0; }
.actor.on { opacity:1; }
.badge { width:36px; height:36px; border-radius:9px; display:grid; place-items:center; background:var(--l4); box-shadow:inset 0 0 0 1px var(--line); color:var(--fg-2); transition:background-color .3s, color .3s, box-shadow .3s; }
.badge svg { width:17px; height:17px; }
.actor.on .badge { color:var(--fg); box-shadow:inset 0 0 0 1px var(--line-3); }
.actor[data-a="threepio"].on .badge { color:var(--amber); background:var(--amber-wash); box-shadow:inset 0 0 0 1px var(--amber-edge), 0 0 0 4px var(--amber-wash); }
.actor[data-a="you"].on .badge { color:var(--green); background:var(--green-wash); box-shadow:inset 0 0 0 1px var(--green-edge); }
.actor b { font-weight:500; font-size:13px; color:var(--row-name); }
.actor small { color:var(--fg-3); font-size:11.5px; line-height:1.3; }
.track { position:absolute; left:8px; right:8px; top:34px; height:0; }
.track .rail { position:absolute; left:12.5%; right:12.5%; top:0; border-top:1px dashed var(--line-2); }
.track .lit { position:absolute; top:-1px; height:2px; background:var(--amber); opacity:0; border-radius:2px; transition:opacity .3s; }
.track .lit.show { opacity:.6; }
.mover { position:absolute; left:0; top:0; width:25%; transform:translateX(calc(var(--x, 0) * 100%)); }
.mover.go { transition:transform .7s var(--ease-in-out); }
.dot { position:absolute; left:50%; top:-4px; width:8px; height:8px; margin-left:-4px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 3px var(--amber-wash); opacity:0; transition:opacity .2s; }
.dot.show { opacity:1; }
.dot.pulse { animation:pulse 1.6s var(--ease-in-out) infinite; }
@keyframes pulse { 50% { box-shadow:0 0 0 8px transparent; } }
.msgchip { position:absolute; top:-10px; transform:translateX(-50%); z-index:2; font:500 11px/1 var(--mono); padding:4px 8px; border-radius:999px; background:var(--l3); box-shadow:inset 0 0 0 1px var(--amber-edge); color:var(--amber); white-space:nowrap; opacity:0; transition:opacity .25s var(--ease-out) .35s; }
.msgchip.show { opacity:1; }

/* ---------- stage ---------- */
.stage { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:20px; align-items:start; }
.story { display:flex; flex-direction:column; gap:14px; min-width:0; position:sticky; top:20px; }
.meter { height:4px; border-radius:4px; background:var(--tint-2); overflow:hidden; }
.meter i { display:block; height:100%; width:100%; background:var(--fg); transform-origin:left; transform:scaleX(var(--p, 0)); transition:transform 240ms var(--ease-out); }
.story .step-eyebrow { font-size:12px; color:var(--fg-3); display:flex; gap:8px; align-items:center; }
.story p { font-size:14.5px; }
.reply { background:var(--well-2); border-radius:10px; padding:12px 14px; box-shadow:inset 0 0 0 1px var(--line); display:flex; flex-direction:column; gap:4px; }
.reply .k { font-size:12px; font-weight:500; color:var(--fg-3); }
.reply .v { color:var(--fg); font-weight:500; font-size:14px; line-height:1.45; }
.reply .src { font:400 11.5px/1.4 var(--mono); color:var(--fg-3); }
.notes { border-radius:10px; padding:12px 14px; box-shadow:inset 0 0 0 1px var(--line-2); background-image:repeating-linear-gradient(-45deg, transparent 0 6px, var(--tint) 6px 7px); }
.notes .k { font-size:12px; font-weight:500; color:var(--fg-3); }
.notes ul { margin:6px 0 0; padding-left:18px; color:var(--fg-2); display:grid; gap:4px; font-size:13px; }
.step-nav { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:4px; }

.screen { background:var(--l1); border-radius:12px; box-shadow:0 0 0 1px var(--line-2), var(--shadow-pop); min-width:0; overflow:hidden; position:relative; }
.screen::before { content:""; position:absolute; inset:0 0 auto; height:2px; background:var(--accent-now, transparent); transition:background .3s; z-index:1; }
.screen[data-who="threepio"] { --accent-now:var(--amber); }
.screen[data-who="you"] { --accent-now:var(--green); }
.screen-bar { display:flex; align-items:center; gap:10px; height:38px; padding:0 12px; border-bottom:1px solid var(--line); background:var(--l3); }
.lights { display:flex; gap:6px; }
.lights i { width:10px; height:10px; border-radius:50%; background:var(--l5); box-shadow:inset 0 0 0 1px var(--line); }
#screen-title { font:400 12px/1 var(--mono); color:var(--fg-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.speaker { margin-left:auto; flex:none; }
.screen-body { padding:14px; display:grid; grid-template-columns:minmax(0,1fr); gap:12px; min-height:360px; align-content:start; background:var(--l2); }
.enter > * { animation:rise .38s var(--ease-out) both; }
.enter > *:nth-child(2) { animation-delay:.05s; } .enter > *:nth-child(3) { animation-delay:.1s; }
.enter > *:nth-child(4) { animation-delay:.15s; } .enter > *:nth-child(5) { animation-delay:.2s; }
@keyframes rise { from { opacity:0; transform:translateY(6px); } }

/* terminal */
pre.term { margin:0; padding:13px 15px; background:var(--l1); border-radius:10px; box-shadow:inset 0 0 0 1px var(--line); overflow-x:auto; font:400 12.5px/1.8 var(--mono); color:var(--fg-2); white-space:pre-wrap; overflow-wrap:break-word; }
.term .p { color:var(--fg-3); user-select:none; }
.term .d { color:var(--fg-3); }
.term .g { color:var(--green); }
.term .a { color:var(--amber); }
.term .r { color:var(--red); }
.term .k { color:var(--fg); }
.term s { color:var(--fg-3); }
.cap { font-size:12px; font-weight:500; color:var(--fg-3); margin-bottom:-4px; }

/* ticket */
.ticket { background:var(--l3); border-radius:12px; box-shadow:inset 0 1px 0 var(--card-edge), inset 0 0 0 1px var(--line); overflow:hidden; }
.ticket.dropped { opacity:.6; }
.t-head { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:9px 14px; border-bottom:1px solid var(--line); font:400 11.5px/1.3 var(--mono); color:var(--fg-3); }
.t-head .state { display:inline-flex; align-items:center; gap:6px; height:20px; padding:0 8px; border-radius:999px; font:500 11px/1 var(--sans); color:var(--fg-2); background:var(--tint); box-shadow:inset 0 0 0 1px var(--line); }
.t-head .state.new { color:var(--green); background:var(--green-wash); box-shadow:inset 0 0 0 1px var(--green-edge); }
.t-head .state.drop { color:var(--red); background:var(--red-wash); box-shadow:inset 0 0 0 1px var(--red-edge); }
.t-head .state.draft { color:var(--amber); background:transparent; box-shadow:none; outline:1px dashed var(--amber-edge); outline-offset:-1px; }
.t-body { padding:13px 16px 15px; display:grid; gap:8px; }
.t-title { font-weight:600; font-size:15px; line-height:1.35; letter-spacing:-.01em; }
.ticket.dropped .t-title { text-decoration:line-through; text-decoration-color:var(--fg-3); }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.md h4 { margin:8px 0 2px; font-size:12.5px; font-weight:600; color:var(--fg); }
.md p, .md ul { margin:0; color:var(--fg-2); font-size:13px; line-height:1.55; }
.md ul { padding-left:18px; display:grid; gap:2px; }
.md .add { background:var(--green-wash); box-shadow:-8px 0 0 var(--green-wash), -10px 0 0 var(--green); border-radius:0 4px 4px 0; }
.md ul.todo { list-style:none; padding-left:0; }
.md ul.todo li { display:grid; grid-template-columns:18px minmax(0,1fr); }
.md ul.todo li::before { content:""; width:11px; height:11px; margin-top:4px; border-radius:3px; box-shadow:inset 0 0 0 1.5px var(--fg-3); }
.why { font-size:12.5px; color:var(--fg-2); border-top:1px solid var(--line); padding-top:9px; }
.why b { color:var(--fg); font-weight:500; }

/* report */
.report { display:grid; grid-template-columns:minmax(0,1fr); gap:10px; }
.remark { background:var(--amber-wash); border-radius:12px; padding:12px 14px; box-shadow:inset 0 0 0 1px var(--amber-edge); display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:start; }
.remark .av { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; color:var(--amber); background:var(--l2); box-shadow:inset 0 0 0 1px var(--amber-edge); }
.remark .av svg { width:16px; height:16px; }
.remark .k { font-size:12px; font-weight:500; color:var(--amber); }
.remark p { margin:4px 0 0; color:var(--fg); font-style:italic; font-size:14px; }
.block { background:var(--l3); border-radius:12px; padding:12px 14px; box-shadow:inset 0 1px 0 var(--card-edge), inset 0 0 0 1px var(--line); }
.block .k { font-size:12px; font-weight:500; color:var(--fg-3); }
.block ul { margin:6px 0 0; padding-left:18px; color:var(--fg-2); display:grid; gap:3px; font-size:13px; }
.checks { display:grid; gap:9px; }
.checks .row { display:grid; grid-template-columns:18px minmax(0,1fr); gap:2px 6px; font-size:13px; color:var(--fg); }

function ticket(t, opts) {
  const state = opts.state === 'comment' ? `<span class="state">comment on #${t.num}</span>`
    : opts.state === 'new' ? '<span class="state new">new issue</span>'
    : opts.state === 'draft' ? '<span class="state draft">draft · not posted</span>'
    : opts.state === 'posted' ? `<span class="state new">#${t.num} · open</span>`
    : opts.state === 'mr' ? `<span class="state new">${MRW()} ${MRN()} · open</span>`
    : '<span class="state drop">no ticket</span>';
  const chips = (t.labels || []).map(l => `<span class="chip${l === 'follow-up' ? ' fu' : ''}">${esc(l)}</span>`).join('');
  const weight = t.weight && !gh() ? `<span class="chip">weight ${t.weight}</span>` : '';
  return `<article class="ticket${opts.state === 'drop' ? ' dropped' : ''}">

const droid = (remark, t) => `<div class="msg droid"><div class="from">threepio</div>${remark ? `<p class="remark-line">${remark}</p>` : ''}${t ? `<p>${t}</p>` : ''}</div>`;
const agent = t => `<div class="msg agent"><div class="from">tblock-mode</div><p>${t}</p></div>`;

const LT_TITLE = 'Archive search returns nothing for systems with a deleted record';
function lifeTicket(stage) {
  const add = stage === 'refined-diff' ? ' class="add"' : '';
  const refined = stage !== 'draft';
  return {
    num:131, title:LT_TITLE, labels:['team-archives'], weight:2,
    body:`<h4>Goal</h4><p>Archive search should find a star system even when its archive record has been deleted. Reported for Kamino.</p>
<h4>Context</h4><p>The navigation survey still has Kamino's coordinates, but <code>findSystem()</code> reads only the archive index, so search returns nothing. The record was removed by a purge of stale systems.</p>
<h4>Where in the code</h4><p><code>src/archive/search.ts</code>, <code>findSystem()</code>. Three callers: the holomap, the nav console, and the Temple kiosk.</p>
<h4>Done when</h4><ul class="todo"><li>Searching for Kamino returns the system, flagged as having a removed record.</li><li>A regression test covers a system with a removed record.</li>${refined ? `<li${add}>The holomap shows the flag.</li>` : ''}</ul>
${refined ? `<h4${add}>Out of scope</h4><p${add}>Restoring Kamino's deleted record, and finding out who deleted it.</p>` : ''}`
  };
}

{ "state": "OPEN" }   <span class="d">← still open, as planned</span>`
: `<span class="p">$ </span>glab mr view 58 --output json | jq '.state, .target_branch'
<span class="g">"merged"</span>
"main"

<span class="p">$ </span>glab issue view 131
<span class="d">#131 · open   ← still open, as planned</span>`) +
      `<div class="block checks"><div class="k">Done when</div>
        <div class="row"><span class="m">✓</span><span>Searching for Kamino returns the system, flagged as removed.</span><small>${MRW()} ${MRN()} Verification · seeded index search</small></div>
        <div class="row"><span class="m">✓</span><span>A regression test covers a system with a removed record.</span><small>test/search.removed.test.ts · passed on main</small></div>
        <div class="row"><span class="m">✓</span><span>The holomap shows the flag.</span><small>screenshot in ${MRW()} ${MRN()}</small></div>
        <div class="row"><span class="m open">○</span><span>Follow-up #147, "Log who deletes Archive records", is still open.</span><small>stays open; it's separate work</small></div>
      </div>` +
      droid(`Every item accounted for. I could almost weep.`, `Close #131 with a comment listing the three checks and the open follow-up?`) +
      `<div class="answers" role="group" aria-label="Close the ticket">
        <button type="button" id="close-yes" class="primary" data-close="close" aria-pressed="${c === 'close'}">Close it</button>
        <button type="button" id="close-no" data-close="leave" aria-pressed="${c === 'leave'}">Leave it open</button>
      </div>`;
      if (!c) return out + '<div class="hint">Pick an answer.</div>';
      out += you(c === 'close' ? 'Close it.' : 'Leave it open for now.');
      out += c === 'leave'
        ? term(`<span class="d">No commands run. #131 stays open, and the closing comment is kept as a draft.</span>`)
        : term(gh()
? `<span class="p">$ </span>gh issue comment 131 --body-file /tmp/tblock/131-close.md
<span class="g">✓</span> https://github.com/${REPO}/issues/131#issuecomment-2219870
<span class="p">$ </span>gh issue close 131 --reason completed
<span class="g">✓</span> Closed issue #131`
: `<span class="p">$ </span>glab issue note 131 --message "$(cat /tmp/tblock/131-close.md)"
<span class="g">✓</span> https://gitlab.com/${REPO}/-/issues/131#note_88941
<span class="p">$ </span>glab issue close 131
<span class="g">✓</span> Closed issue #131`);
      return out;
    },
    notes:['The "Done when" list from the very first draft comes back here as the checklist.','Let someone pick close or leave.']
  },
  {
    id:'l-blocks', short:'Won\'t close', who:'threepio', on:['threepio'], from:'threepio',
    title:'When it won\'t close a ticket',
    text:`Close-out is where a wrong guess costs the most, so threepio stops and asks whenever the evidence is missing.`,
    more:`In every case below it comments or reports, and the ticket stays open.`,
    rule:'When in doubt it comments and asks. It never closes on a guess.',
    src:'Proposed · ticket-up, close out',
    screenTitle:'threepio · close-out guards',
    screen:() => `<div class="cases">
      <div class="case"><b>The ${MRW()} was closed, not merged</b><span>Nothing landed, so the work isn't done.</span><span class="then">Reports it, ticket stays open</span></div>
      <div class="case"><b>A "Done when" item isn't met</b><span>For example, no screenshot shows the holomap flag.</span><span class="then">Lists the gap, asks you</span></div>
      <div class="case"><b>Another ${MRW()} for #131 is still open</b><span>A branch like <code>131-part-2</code> hasn't merged yet.</span><span class="then">Waits for the last one</span></div>
      <div class="case"><b>${forgeName()} can't be reached</b><span>Not logged in, or the network is down.</span><span class="then">Says so, claims nothing</span></div>
    </div>`,
    notes:['This is what makes "threepio always closes tickets" safe.']
  },
  {
    id:'l-recap', short:'Recap', who:'threepio', on:['you','threepio','main','forge'], from:null,
    title:'Who does what',
    text:() => `Threepio owns the ticket from first draft to close. tblock-mode is there if you want it for the work, the ${MRW()}, and babysitting. You approve each step and do the merge.`,
    more:`Still to check before building: whether VS Code's agent picker shows plugin agents, whether handoff buttons work, and whether the agent file can limit threepio's tools.`,
    rule:'Threepio never edits code, pushes code, or merges.',
    src:'Proposed flow, agreed 11 Nov 2026',
    screenTitle:'summary',
    screen:() => `<div class="tbl"><table class="roles">
      <thead><tr><th></th><th>threepio</th><th>tblock-mode</th><th>You</th></tr></thead>
      <tbody>
        <tr><td>Write and refine the ticket</td><td class="yes">Yes</td><td class="no">—</td><td class="yes">Describe, edit</td></tr>
        <tr><td>Create the ticket</td><td class="yes">After your yes</td><td class="no">—</td><td class="yes">Approve</td></tr>
        <tr><td>Create the branch</td><td class="yes">After your yes</td><td class="no">—</td><td class="yes">Approve</td></tr>
        <tr><td>Do the work</td><td class="no">Never</td><td class="yes">Optional</td><td class="yes">Or you</td></tr>
        <tr><td>Open the ${MRW()}</td><td class="no">Drafts the comment</td><td class="yes">Playbook</td><td class="yes">Or you</td></tr>
        <tr><td>Babysit to merge-ready</td><td class="no">—</td><td class="yes">Yes</td><td class="no">—</td></tr>
        <tr><td>Merge</td><td class="no">Never</td><td class="no">Never</td><td class="yes">Yes</td></tr>
        <tr><td>Close the ticket</td><td class="yes">After your yes</td><td class="no">—</td><td class="yes">Approve</td></tr>
      </tbody></table></div>`,
    notes:['End on the open questions so nobody thinks this ships today.']
  }
];

const FLOWS = {
  done: {
    steps:STEPS_DONE, order:['you', 'main', 'threepio', 'forge'],
    status:['green', 'Built'],
    title:'Threepio drafts the tickets when the work is done',
    lead:'tblock-mode fixes a bug in the Jedi Archives, then hands the paperwork to threepio. It drafts the tickets in a grumbling protocol-droid voice, and a person says yes before anything is posted.',
    info:() => ({ you:['You','approve'], main:['Main agent','tblock-mode'], threepio:['threepio','subagent'], forge:[forgeName(),'issues'] }),
    who:{ main:'Main agent', threepio:'threepio', you:'You' }
  },
  life: {
    steps:STEPS_LIFE, order:['you', 'threepio', 'main', 'forge'],
    status:['amber', 'Proposed, not built yet'],
    title:'Threepio owns the ticket, from first draft to close',
    lead:'You talk to threepio in the VS Code chat. It writes the ticket, starts the branch, and closes the ticket once the merge proves the work is done. You say yes at every step, and tblock-mode is optional for the work.',
    info:() => ({ you:['You','ask, approve'], threepio:['threepio','chat agent'], main:['tblock-mode','optional'], forge:[forgeName(),`issues, ${MRW()}s`] }),
    who:{ main:'tblock-mode', threepio:'threepio', you:'You' }
  }
};
const steps = () => FLOWS[S.flow].steps;
const order = () => FLOWS[S.flow].order;

const val = v => typeof v === 'function' ? v() : v;

function renderActors(step) {
  const info = FLOWS[S.flow].info();
  const on = val(step.on);
  $('#actors').innerHTML = order().map(a => `<div class="actor${on.includes(a) ? ' on' : ''}" data-a="${a}">
    <div class="badge">${ICON[a]}</div><b>${esc(info[a][0])}</b><small>${esc(info[a][1])}</small></div>`).join('');
}

let lastStep = -1;
function moveDot(step, animate) {
  const mover = $('#mover'), dot = $('#dot'), lit = $('#lit'), chip = $('#msgchip');
  const to = val(step.to), from = val(step.from);
  const f = order().indexOf(from), t = to ? order().indexOf(to) : -1;
  if (t >= 0 && step.msg) {
    chip.textContent = val(step.msg);
    chip.style.left = `${(t - Math.sign(t - f) * 0.5) * 25 + 12.5}%`;
    chip.classList.remove('show');
    if (animate) void chip.offsetWidth;
    chip.classList.add('show');
  } else chip.classList.remove('show');
  dot.classList.toggle('show', f >= 0);
  dot.classList.toggle('pulse', f >= 0 && t < 0);
  if (t >= 0) {
    const lo = Math.min(f, t), hi = Math.max(f, t);
    lit.style.left = `calc(${lo * 25 + 12.5}%)`;
    lit.style.width = `${(hi - lo) * 25}%`;
    lit.classList.add('show');
  } else lit.classList.remove('show');
  if (f < 0) return;
  mover.classList.remove('go');
  mover.style.setProperty('--x', f);
  if (t >= 0 && animate) {
    void mover.offsetWidth;
    mover.classList.add('go');
    mover.style.setProperty('--x', t);
  } else if (t >= 0) {
    mover.style.setProperty('--x', t);
  }
}

function render(animate = true) {
  const STEPS = steps();
  const step = STEPS[S.i];
  const key = S.flow + S.i;
  const moved = lastStep !== key;
  renderActors(step);
  moveDot(step, animate && moved);

  const who = val(step.who);
  const whoLabel = FLOWS[S.flow].who[who];
  $('#story').innerHTML = `
    <div class="meter" aria-hidden="true"><i style="--p:${(S.i + 1) / STEPS.length}"></i></div>
    <div class="step-eyebrow">Step ${S.i + 1} of ${STEPS.length}<span class="pill ${who}">${whoLabel}</span></div>
    <h2>${val(step.title)}</h2>
    <p>${val(step.text)}</p>
    <p>${val(step.more)}</p>
    <div class="reply"><span class="k">The rule</span><span class="v">${val(step.rule)}</span><span class="src">${esc(step.src)}</span></div>
    ${S.notes ? `<div class="notes"><span class="k">Speaker notes</span><ul>${step.notes.map(n => `<li>${n}</li>`).join('')}</ul></div>` : ''}`;

  $('#screen-title').textContent = val(step.screenTitle);
  $('#screen-panel').dataset.who = who;
  $('#speaker').className = `pill speaker ${who}`;
  $('#speaker-name').textContent = whoLabel;
  const screen = $('#screen');
  screen.innerHTML = val(step.screen);
  if (animate && moved) { screen.classList.remove('enter'); void screen.offsetWidth; screen.classList.add('enter'); }

  const F = FLOWS[S.flow];
  document.querySelectorAll('[data-flow]').forEach(b => b.setAttribute('aria-current', b.dataset.flow === S.flow ? 'page' : 'false'));
  $('#flow-title').textContent = F.title;
  $('#flow-lead').innerHTML = F.lead;
  const sp = $('#status-pill'); sp.className = `pill ${F.status[0]}`; sp.textContent = F.status[1];
  $('#harness-ctl').hidden = S.flow === 'life';
  $('#stepcount').textContent = `${S.i + 1} / ${STEPS.length}`;

  const list = $('#steps');
  list.innerHTML = STEPS.map((s, i) => `<button type="button" role="tab" class="step-btn${i < S.i ? ' done' : ''}" data-i="${i}" ${i === S.i ? 'aria-current="step" aria-selected="true"' : 'aria-selected="false"'}><span class="n">${i + 1}</span><span>${esc(s.short)}</span></button>`).join('');
  const cur = list.querySelector('[aria-current="step"]');
  if (cur && (cur.offsetTop < list.scrollTop || cur.offsetTop + cur.offsetHeight > list.scrollTop + list.clientHeight)) list.scrollTop = cur.offsetTop - list.clientHeight / 2;

  $('#prev').disabled = S.i === 0;
  $('#next').disabled = S.i === STEPS.length - 1;
  document.querySelectorAll('[data-harness]').forEach(b => b.setAttribute('aria-pressed', b.dataset.harness === S.harness));
  document.querySelectorAll('[data-forge]').forEach(b => b.setAttribute('aria-pressed', b.dataset.forge === S.forge));
  $('#notes-btn').setAttribute('aria-pressed', S.notes);
  applyTheme();

  lastStep = key;
  const h = '#' + step.id;
  if (location.hash !== h) { try { history.replaceState(null, '', h); } catch (e) {} }
}

function go(i) {
  const STEPS = steps();
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  if (STEPS[S.i].id === 'approve' && i > S.i && !S.choice) S.choice = 'yes';
  if (STEPS[S.i].onLeave && i > S.i) STEPS[S.i].onLeave();
  S.i = i; render();
}
function setFlow(f) {
  if (f === S.flow) return;
  S.flow = f; S.i = 0; render();
}

document.addEventListener('click', e => {
  const pill = e.target.closest('[data-i]'); if (pill) return go(+pill.dataset.i);
  const h = e.target.closest('[data-harness]'); if (h) { S.harness = h.dataset.harness; save(); return render(false); }
  const f = e.target.closest('[data-forge]'); if (f) { S.forge = f.dataset.forge; save(); return render(false); }
  if (e.target.closest('#theme-btn')) return setTheme(currentTheme() === 'light' ? 'dark' : 'light');
  const c = e.target.closest('[data-choice]'); if (c) { S.choice = c.dataset.choice; return render(false); }
  const fl = e.target.closest('[data-flow]'); if (fl) return setFlow(fl.dataset.flow);
  const w = e.target.closest('[data-work]'); if (w) { S.work = w.dataset.work; return render(false); }
  const cl = e.target.closest('[data-close]'); if (cl) { S.close = cl.dataset.close; return render(false); }
  if (e.target.closest('#prev')) return go(S.i - 1);
  if (e.target.closest('#next')) return go(S.i + 1);
  if (e.target.closest('#notes-btn')) { S.notes = !S.notes; save(); return render(false); }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !e.target.closest('button'))) { e.preventDefault(); go(S.i + 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(S.i - 1); }
  else if (k === 'Home') go(0);
  else if (k === 'End') go(steps().length - 1);
  else if (k === 'l' || k === 'L') setFlow(S.flow === 'done' ? 'life' : 'done');
  else if (k === '1') setFlow('done');
  else if (k === '2') setFlow('life');
  else if (k === 'n' || k === 'N') { S.notes = !S.notes; save(); render(false); }
  else if (k === 'h' || k === 'H') { S.harness = S.harness === 'cc' ? 'cp' : 'cc'; save(); render(false); }
  else if (k === 'f' || k === 'F') { S.forge = S.forge === 'gh' ? 'gl' : 'gh'; save(); render(false); }
  else if (k === 't' || k === 'T') setTheme(currentTheme() === 'light' ? 'dark' : 'light');
});
function findHash() {
  for (const f of Object.keys(FLOWS)) {
    const i = FLOWS[f].steps.findIndex(s => '#' + s.id === location.hash);
    if (i >= 0) return { f, i };
  }
  return null;
}
window.addEventListener('hashchange', () => {
  const h = findHash();
  if (h && (h.f !== S.flow || h.i !== S.i)) { S.flow = h.f; S.i = h.i; render(); }
});
const start = findHash();
if (start) { S.flow = start.f; S.i = start.i; }
render(false);
</script>
